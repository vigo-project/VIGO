# Continuous integration: builds the solution and runs the unit tests on every push and pull request.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # global.json is pinned exactly: shows which SDK the build really uses.
      - name: SDK info
        run: dotnet --info

      - name: Build (Release)
        run: dotnet build VIGO.slnx -c Release -p:Platform=x64

      - name: Tests
        run: |
          dotnet test --project tests/Vigo.Core.Tests -c Release -p:Platform=x64
          dotnet test --project tests/Vigo.Git.Tests -c Release -p:Platform=x64
          dotnet test --project tests/Vigo.Graph.Tests -c Release -p:Platform=x64
          dotnet test --project tests/Vigo.Integrations.Tests -c Release -p:Platform=x64
