# Beta deployment: pushing a tag "v<version>" (e.g. v0.1.0-beta.2) builds the Native AOT app, packs the installer and the
# update packages with Velopack and publishes them as a release of this repository (a pre-release when the version has a suffix, e.g. 0.28.0-beta.1). Installed copies update themselves from it.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to pack (SemVer, e.g. 0.1.0-beta.2)'
        required: true

permissions:
  contents: write
  checks: read

jobs:
  # The tests run in the ci workflow: wait for it to finish on this commit (the tag may be pushed before) and require success.
  ci-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for a green ci
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          missing=0
          for i in $(seq 1 90); do
            run=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs" \
              --jq '[.check_runs[] | select(.name == "build")] | first // empty | "\(.status) \(.conclusion)"')
            case "$run" in
              "completed success") echo "ci is green on ${{ github.sha }}"; exit 0 ;;
              "completed "*) echo "::error::ci finished with '${run#completed }' on ${{ github.sha }}"; exit 1 ;;
              "") missing=$((missing + 1)); if [ "$missing" -ge 10 ]; then echo "::error::no ci run found for ${{ github.sha }}: push it to main first"; exit 1; fi ;;
            esac
            sleep 30
          done
          echo "::error::ci did not finish within 45 minutes"; exit 1

  release:
    needs: ci-gate
    runs-on: windows-latest
    env:
      VERSION: ${{ github.event.inputs.version || github.ref_name }}
      INSTALLER_REPO: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # Shows which SDK the build really uses (global.json is pinned exactly: a newer preinstalled SDK must not win).
      - name: SDK info
        run: dotnet --info

      - name: Version
        shell: pwsh
        run: |
          $v = "$env:VERSION".TrimStart('v')
          if ($v -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "Invalid version '$v'" }
          # The "What's new" dialog shows the section titled with this exact version: none means no dialog.
          foreach ($f in 'src/Vigo.Core/Changelog/CHANGELOG-fr.md', 'src/Vigo.Core/Changelog/CHANGELOG-en.md') {
            if (-not (Select-String -Path $f -Pattern "^## $([regex]::Escape($v))( |$)" -Quiet)) { throw "No '## $v' section in $f" }
          }
          "PACK_VERSION=$v" | Out-File -Append -FilePath $env:GITHUB_ENV

      - name: Publish (Native AOT)
        run: dotnet publish src/Vigo.App -c Release -r win-x64 -p:Platform=x64 -p:Version=${{ env.PACK_VERSION }} -o artifacts/publish/aot-x64

      - name: Velopack
        run: dotnet tool install --global vpk --version 1.2.161

      # Previous releases give the delta packages (updates download only what changed).
      - name: Download previous releases
        continue-on-error: true
        run: vpk download github --repoUrl ${{ env.INSTALLER_REPO }} --pre --token ${{ secrets.GITHUB_TOKEN }}

      - name: Pack
        run: >
          vpk pack --packId VIGO --packTitle "VIGO" --packAuthors "VIGO" --packVersion ${{ env.PACK_VERSION }}
          --packDir artifacts/publish/aot-x64 --mainExe Vigo.exe --icon src/Vigo.App/Assets/Vigo.ico --outputDir Releases

      # A version with a SemVer suffix (0.28.0-beta.1) is published as a pre-release, a plain one (0.28.0) as a stable release.
      - name: Upload
        shell: pwsh
        run: |
          $pre = @(); if ($env:PACK_VERSION.Contains('-')) { $pre = @('--pre') }
          vpk upload github --repoUrl $env:INSTALLER_REPO --outputDir Releases --token ${{ secrets.GITHUB_TOKEN }} `
            --tag "v$env:PACK_VERSION" --releaseName "VIGO $env:PACK_VERSION" @pre --publish
          if ($LASTEXITCODE -ne 0) { throw "vpk upload failed (exit code $LASTEXITCODE)" }
