# SonarCloud automatic analysis.
# Duplication in the tests is mostly arrange code (real repos built through TestRepoBuilder): not measured.
sonar.cpd.exclusions=tests/**,benchmarks/**

# Rules that do not apply to the code of this repository (reviewed one by one, see the justification of each).
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6

# S2930: the CancellationTokenSource fields (_disposed, _stop) are only cancelled, never disposed on purpose:
# they have no timer nor wait handle (nothing to release) and `.Token` throws once the source is disposed,
# while late continuations still read it.
sonar.issue.ignore.multicriteria.e1.ruleKey=csharpsquid:S2930
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.cs

# S1244: exact comparisons of floats and sizes are change detection (cache keys of a rendered frame), not computed results.
sonar.issue.ignore.multicriteria.e2.ruleKey=csharpsquid:S1244
sonar.issue.ignore.multicriteria.e2.resourceKey=src/Vigo.App/**

# S3168: async void event handlers (WinUI) and fire-and-forget entry points.
sonar.issue.ignore.multicriteria.e3.ruleKey=csharpsquid:S3168
sonar.issue.ignore.multicriteria.e3.resourceKey=src/Vigo.App/**

# S8949: Task.Run / fire-and-forget calls that must outlive the caller (window startup, preferences write, window moves).
sonar.issue.ignore.multicriteria.e4.ruleKey=csharpsquid:S8949
sonar.issue.ignore.multicriteria.e4.resourceKey=src/**

# S2583: the flow analysis does not see the writes made from lambdas and from the dialog result.
sonar.issue.ignore.multicriteria.e5.ruleKey=csharpsquid:S2583
sonar.issue.ignore.multicriteria.e5.resourceKey=src/**

# Test, benchmark and tool code: throwaway credentials and URLs, seeded Random, MD5 as a benchmark input, git found through PATH.
sonar.issue.ignore.multicriteria.e6.ruleKey=csharpsquid:S*
sonar.issue.ignore.multicriteria.e6.resourceKey=tests/**,benchmarks/**
